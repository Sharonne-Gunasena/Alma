<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma</title>
    <meta name="description" content="Timetable, deadlines, an adaptive study planner and AI flashcards from your lecture slides, in one place." />
    <script>
      // Apply the saved appearance before first paint (see src/lib/theme.js).
      try {
        var t = localStorage.getItem('cl_theme');
        var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%23ea580c' stroke-width='14'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
